*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#102235,#06101a 55%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.hidden{display:none!important}

ight:950;cursor:pointer;box-shadow:0 10px 28px #0007}.finishClose{position:absolute;right:12px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:#ffffff14;color:#fff;font-size:26px;line-height:1;cursor:pointer}

ine-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gpsIcon,.projIcon,.waterIcon,.shopIcon{display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:900;box-shadow:0 2px 10px #000a}.gpsIcon{width:40px;height:40px;background:var(--yel);border:3px solid white;color:#111;font-size:22px}.projIcon{width:16px;height:16px;background:white;border:3px solid #111}.waterIcon{width:26px;height:26px;background:#31b7ff;color:#06111b}.shopIcon{width:28px;height:28px;background:#ff9f2d;color:#06111b}a{color:#9ad2ff}@media(max-width:900px){#data{grid-template-columns:repeat(2,minmax(0,1fr))}.val{font-size:16px}}
