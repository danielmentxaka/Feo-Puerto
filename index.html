<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Feo Puerto Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#071019;--card:#101c29;--line:#203447;--txt:#edf5ff;--mut:#8fa5bb;--yel:#ffcc33;--trk:#4fb0ff;--real:#74ff91;--w:#31b7ff;--s:#ff9f2d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}#mapWrap{height:60vh;min-height:320px;max-height:650px;position:relative;overflow:hidden;contain:layout paint;border-bottom:1px solid var(--line);background:#0c1723}#map{height:100%;width:100%;background:#0c1723}.leaflet-container{background:#0c1723}#status{position:absolute;z-index:900;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#071019e8;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;box-shadow:0 6px 20px #0008}.mut{color:var(--mut);font-weight:700;text-align:right}#profWrap{height:20vh;min-height:145px;padding:8px 10px;background:#08131f;border-bottom:1px solid var(--line)}#prof{width:100%;height:100%;display:block;border:1px solid var(--line);border-radius:13px;background:#0c1723}#data{min-height:22vh;padding:8px 10px 18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:#071019}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}.lab{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.val{font-size:18px;font-weight:900;margin-top:2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.waterIcon,.shopIcon,.meIcon{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#06111b;font-weight:900;box-shadow:0 2px 8px #0008}.waterIcon{background:var(--w);width:24px;height:24px}.shopIcon{background:var(--s);width:25px;height:25px}.meIcon{background:var(--yel);width:36px;height:36px;border:3px solid white;color:#111}@media(max-width:700px){#mapWrap{height:58vh;min-height:320px}#profWrap{height:21vh;min-height:145px}#data{grid-template-columns:repeat(2,minmax(0,1fr))}.val{font-size:16px}}
</style>
</head>
<body>
<section id="mapWrap"><div id="map"></div><div id="status"><div class="pill">Feo Puerto Live</div><div id="st" class="pill mut">Cargando...</div></div></section>
<section id="profWrap"><canvas id="prof"></canvas></section>
<section id="data">
<div class="card"><div class="lab">Distancia total</div><div id="td" class="val">-</div></div>
<div class="card"><div class="lab">Recorrida</div><div id="dd" class="val">-</div></div>
<div class="card"><div class="lab">Por recorrer</div><div id="ld" class="val">-</div></div>
<div class="card"><div class="lab">Última posición</div><div id="age" class="val">-</div></div>
<div class="card"><div class="lab">Batería restante</div><div id="bat" class="val">-</div></div>
<div class="card"><div class="lab">Velocidad actual</div><div id="vn" class="val">-</div></div>
<div class="card"><div class="lab">Velocidad media</div><div id="vm" class="val">-</div></div>
<div class="card"><div class="lab">D+ total</div><div id="gt" class="val">-</div></div>
<div class="card"><div class="lab">D+ hecho / restante</div><div id="gl" class="val">-</div></div>
</section>
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const RID=new URLSearchParams(location.search).get('id')||'daniel-live';
const SB=(window.FEO_SUPABASE_URL||'').replace(/\/$/,'');
const KEY=window.FEO_SUPABASE_ANON_KEY||'';
const st=document.getElementById('st');
const map=L.map('map',{zoomControl:true,preferCanvas:true,zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:140,wheelDebounceTime:90,inertia:true,inertiaDeceleration:2500,maxBoundsViscosity:.35});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:2,attribution:'&copy; OpenStreetMap'}).addTo(map);
map.createPane('trackPane');map.getPane('trackPane').style.zIndex=450;
map.createPane('realPane');map.getPane('realPane').style.zIndex=470;
map.createPane('poiPane');map.getPane('poiPane').style.zIndex=620;
map.createPane('posPane');map.getPane('posPane').style.zIndex=720;
let tr=null,real=null,me=null,poi=L.layerGroup().addTo(map),fitted=false,fitMode='';
const N=v=>Number(v), finite=v=>Number.isFinite(Number(v));
function ic(c,t){return L.divIcon({className:'',html:`<div class="${c}">${t}</div>`,iconSize:[36,36],iconAnchor:[18,18]})}
function fkm(m){return Number.isFinite(m)?(m/1000).toFixed(1).replace('.',',')+' km':'-'}
function fm(m){return Number.isFinite(m)?Math.round(m)+' m':'-'}
function fs(v){return Number.isFinite(v)?v.toFixed(1).replace('.',',')+' km/h':'-'}
function fb(v){return Number.isFinite(v)?Math.round(v)+'%':'-'}
function fa(ms){if(!ms)return'-';let s=Math.max(0,Math.round((Date.now()-ms)/1000));if(s<60)return s+'s';let m=Math.round(s/60);return m<60?m+'min':Math.round(m/60)+'h'}
function cl(n,a,b){return Math.max(a,Math.min(b,n))}
async function api(p){let r=await fetch(SB+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('Supabase '+r.status);return await r.json()}
async function load(){if(!SB||!KEY){st.textContent='Falta config.js';return}try{map.invalidateSize(false);let rows=await api(`feo_live_sessions?select=payload,updated_at&id=eq.${encodeURIComponent(RID)}`);if(!rows.length){st.textContent='Live apagado';render({},[],0);return}let sess=rows[0].payload||{};let start=N(sess.sessionStartedAtMs);if(!Number.isFinite(start))start=N(sess.timestamp);if(!Number.isFinite(start))start=Date.parse(rows[0].updated_at);let q=`feo_live_points?select=lat,lon,ele,speed_kmh,actual_distance_m,battery_percent,time_ms&session_id=eq.${encodeURIComponent(RID)}&order=time_ms.asc&limit=5000`;if(Number.isFinite(start))q+='&time_ms=gte.'+Math.floor(start);let pts=await api(q);render(sess,pts||[],rows[0].updated_at)}catch(e){st.textContent='Error: '+e.message}}
function norm(p){if(!p||!finite(p.lat)||!finite(p.lon))return null;return{lat:N(p.lat),lon:N(p.lon),ele:N(p.ele),time:N(p.time),speedKmh:N(p.speedKmh),actualDistanceM:N(p.actualDistanceM),batteryPercent:N(p.batteryPercent)}}
function render(sess,pts,updatedAt){let route=Array.isArray(sess.route)?sess.route.map(p=>({lat:N(p.lat),lon:N(p.lon),ele:N(p.ele),distM:N(p.distM),grade:N(p.grade)})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)):[];let pois=Array.isArray(sess.pois)?sess.pois:[];let actual=pts.map(p=>({lat:N(p.lat),lon:N(p.lon),ele:N(p.ele),time:N(p.time_ms),speedKmh:N(p.speed_kmh),actualDistanceM:N(p.actual_distance_m),batteryPercent:N(p.battery_percent)})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon));let last=actual.length?actual[actual.length-1]:norm(sess.position);let near=route.length&&last?nearest(route,last.lat,last.lon):null;let total=totalDist(route,sess.summary);let done=near?near.distM:(last&&Number.isFinite(last.actualDistanceM)?last.actualDistanceM:N(sess.distanceM));done=Number.isFinite(done)?cl(done,0,total||done):NaN;let left=Number.isFinite(total)&&Number.isFinite(done)?Math.max(0,total-done):NaN;let g=gain(route,done,sess.summary);let latestMs=last&&Number.isFinite(last.time)?last.time:(N(sess.timestamp)||Date.parse(updatedAt));let avg=avgSpeed(actual,done,sess);td.textContent=fkm(total);dd.textContent=fkm(done);ld.textContent=fkm(left);age.textContent=fa(latestMs);bat.textContent=fb(last&&Number.isFinite(last.batteryPercent)?last.batteryPercent:N(sess.batteryPercent));vn.textContent=fs(last&&Number.isFinite(last.speedKmh)?last.speedKmh:N(sess.speedKmh));vm.textContent=fs(avg);gt.textContent=fm(g.total);gl.textContent=fm(g.done)+' / '+fm(g.left);st.textContent='Track '+route.length+' pts · Pos '+(last?fa(latestMs):'sin GPS');drawMap(route,pois,actual,last,near);drawProf(route,pois,done)}
function avgSpeed(actual,done,sess){if(!actual.length)return NaN;let first=actual[0],last=actual[actual.length-1];let elapsed=(last.time-first.time)/3600000;if(!Number.isFinite(elapsed)||elapsed<1/60)return NaN;let d=Number.isFinite(last.actualDistanceM)?last.actualDistanceM:NaN;if(!Number.isFinite(d)||d<10)d=NaN;return Number.isFinite(d)?d/1000/elapsed:NaN}
function totalDist(r,sum){let d=sum&&Number.isFinite(N(sum.distanceM))?N(sum.distanceM):NaN;if(Number.isFinite(d)&&d>0)return d;if(r.length&&Number.isFinite(r[r.length-1].distM))return r[r.length-1].distM;return NaN}
function drawMap(route,pois,actual,last,near){map.invalidateSize(false);if(route.length){let ll=route.map(p=>[p.lat,p.lon]);if(!tr)tr=L.polyline(ll,{pane:'trackPane',weight:7,opacity:1,color:'#4fb0ff',smoothFactor:1}).addTo(map);else tr.setLatLngs(ll);if(!fitted||fitMode!=='route'){let b=tr.getBounds();map.fitBounds(b.pad(.035),{padding:[14,14],animate:false});map.setMaxBounds(b.pad(.18));fitted=true;fitMode='route';setTimeout(()=>{map.invalidateSize(false);map.fitBounds(b.pad(.035),{padding:[14,14],animate:false})},350)}}if(actual.length){let ll=actual.map(p=>[p.lat,p.lon]);if(!real)real=L.polyline(ll,{pane:'realPane',weight:6,opacity:.95,color:'#74ff91',smoothFactor:1}).addTo(map);else real.setLatLngs(ll)}poi.clearLayers();for(const p of pois){if(!finite(p.lat)||!finite(p.lon))continue;let sup=!!p.supermarket;let name=p.name||(sup?'Supermercado':'Agua');L.marker([N(p.lat),N(p.lon)],{pane:'poiPane',icon:ic(sup?'shopIcon':'waterIcon',sup?'S':'💧')}).bindPopup('<b>'+name+'</b>').addTo(poi)}let mp=near?{lat:near.lat,lon:near.lon}:last;if(mp){let ll=[mp.lat,mp.lon];if(!me)me=L.marker(ll,{pane:'posPane',icon:ic('meIcon','●'),zIndexOffset:5000}).addTo(map).bindPopup('Posición en el track');else me.setLatLng(ll);if(!route.length&&(!fitted||fitMode!=='point')){let b=bounds(mp.lat,mp.lon,50000);map.fitBounds(b,{padding:[14,14],animate:false});map.setMaxBounds(b.pad(.05));fitted=true;fitMode='point'}}}
function bounds(lat,lon,m){let dlat=m/111320,dlon=m/(111320*Math.max(.2,Math.cos(lat*Math.PI/180)));return L.latLngBounds([lat-dlat,lon-dlon],[lat+dlat,lon+dlon])}
function hav(a,b,c,d){let R=6371000,rad=x=>x*Math.PI/180,dl=rad(c-a),dn=rad(d-b),q=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function nearest(r,lat,lon){let bd=Infinity,b=null;for(const p of r){let d=hav(lat,lon,p.lat,p.lon);if(d<bd){bd=d;b=p}}return b}
function gain(r,cur,sum){let total=sum&&Number.isFinite(N(sum.gainM))?N(sum.gainM):NaN,done=0;if(r.length){let calc=0;for(let i=1;i<r.length;i++){let inc=Math.max(0,(r[i].ele||0)-(r[i-1].ele||0));calc+=inc;if(Number.isFinite(cur)&&(r[i].distM||0)<=cur)done+=inc}if(!Number.isFinite(total)||total<=0)total=calc;if(Number.isFinite(cur)&&cur>=totalDist(r,sum))done=total}return{total,done,left:Number.isFinite(total)&&Number.isFinite(done)?Math.max(0,total-done):NaN}}
function drawProf(r,pois,cur){let c=prof,ra=Math.max(1,devicePixelRatio||1),rc=c.getBoundingClientRect();c.width=Math.max(1,Math.round(rc.width*ra));c.height=Math.max(1,Math.round(rc.height*ra));let x=c.getContext('2d');x.scale(ra,ra);let w=rc.width,h=rc.height;x.fillStyle='#0c1723';x.fillRect(0,0,w,h);if(!r.length){x.fillStyle='#8fa5bb';x.font='14px system-ui';x.fillText('Sin perfil de track',16,30);return}let mn=Math.min(...r.map(p=>Number.isFinite(p.ele)?p.ele:0)),mx=Math.max(...r.map(p=>Number.isFinite(p.ele)?p.ele:0)),tot=r[r.length-1].distM||1,xx=d=>12+(w-24)*(d/tot),yy=e=>h-18-(h-30)*((e-mn)/Math.max(1,mx-mn));x.beginPath();x.moveTo(xx(0),h-18);r.forEach(p=>x.lineTo(xx(p.distM||0),yy(p.ele||0)));x.lineTo(xx(tot),h-18);x.closePath();x.fillStyle='rgba(79,176,255,.20)';x.fill();x.strokeStyle='#4fb0ff';x.lineWidth=2.5;x.beginPath();r.forEach((p,i)=>{let a=xx(p.distM||0),b=yy(p.ele||0);if(i===0)x.moveTo(a,b);else x.lineTo(a,b)});x.stroke();for(const p of pois){if(!finite(p.routeDistM))continue;x.fillStyle=p.supermarket?'#ff9f2d':'#31b7ff';x.beginPath();x.arc(xx(N(p.routeDistM)),19,5,0,7);x.fill()}if(Number.isFinite(cur)){let cm=cl(cur,0,tot),a=xx(cm),b=yy(eleAt(r,cm));x.strokeStyle='#ffcc33';x.lineWidth=2;x.beginPath();x.moveTo(a,8);x.lineTo(a,h-10);x.stroke();x.fillStyle='#ffcc33';x.beginPath();x.arc(a,b,8,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}}
function eleAt(r,d){for(let i=1;i<r.length;i++)if((r[i].distM||0)>=d){let a=r[i-1],b=r[i],sp=Math.max(1,(b.distM||0)-(a.distM||0)),t=(d-(a.distM||0))/sp;return(a.ele||0)+((b.ele||0)-(a.ele||0))*t}return r.length?r[r.length-1].ele||0:0}
load();setInterval(load,60000);addEventListener('resize',()=>setTimeout(load,150));addEventListener('orientationchange',()=>setTimeout(load,450));
</script>
</body>
</html>
