<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Feo Puerto Live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQqRkoM6QH9rG7+6h7sV5dGe1cn9k+4=" crossorigin="" />
  <style>
    :root { --bg:#071019; --card:#101c29; --line:#203447; --text:#edf5ff; --muted:#8fa5bb; --accent:#ffcc33; --track:#4fb0ff; --real:#74ff91; --water:#31b7ff; --shop:#ff9f2d; --bad:#ffdca8; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body { min-height:100vh; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
    #page { min-height:100vh; display:block; }
    #mapWrap { height:60vh; min-height:300px; max-height:640px; position:relative; overflow:hidden; z-index:0; border-bottom:1px solid var(--line); background:#0c1723; isolation:isolate; }
    #map { height:100%; width:100%; background:#0c1723; position:relative; z-index:0; }
    .leaflet-container, .leaflet-pane, .leaflet-control-container { z-index:0 !important; }
    .leaflet-top, .leaflet-bottom { z-index:2 !important; }
    #status { position:absolute; z-index:5; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; gap:8px; pointer-events:none; }
    .pill { background:#071019e6; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:7px 11px; box-shadow:0 6px 20px #0008; font-weight:800; font-size:13px; }
    .pill.muted { color:var(--muted); font-weight:700; text-align:right; }
    #profileWrap { height:20vh; min-height:135px; padding:8px 10px; background:#08131f; border-bottom:1px solid var(--line); position:relative; z-index:3; }
    #profile { width:100%; height:100%; display:block; border:1px solid var(--line); border-radius:13px; background:#0c1723; }
    #dataPanel { min-height:20vh; padding:8px 10px 18px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; background:#071019; position:relative; z-index:3; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 9px; min-width:0; }
    .label { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.07em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .value { font-size:18px; font-weight:900; margin-top:2px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .waterIcon, .shopIcon, .meIcon { display:flex; align-items:center; justify-content:center; border-radius:50%; color:#06111b; font-weight:900; box-shadow:0 2px 8px #0008; }
    .waterIcon { background:var(--water); width:24px; height:24px; font-size:15px; }
    .shopIcon { background:var(--shop); width:25px; height:25px; font-size:14px; }
    .meIcon { background:var(--accent); width:34px; height:34px; border:3px solid white; color:#111; }
    .warn { max-width:780px; margin:24px auto; padding:16px; border-radius:14px; background:#2a1d11; border:1px solid #7b5728; color:var(--bad); }
    @media (max-width:700px) {
      #mapWrap { height:58vh; min-height:320px; }
      #profileWrap { height:21vh; min-height:145px; }
      #dataPanel { grid-template-columns:repeat(2,minmax(0,1fr)); min-height:22vh; }
      .value { font-size:16px; }
    }
  </style>
</head>
<body>
  <main id="page">
    <section id="mapWrap">
      <div id="map"></div>
      <div id="status"><div class="pill">Feo Puerto Live</div><div id="statusText" class="pill muted">Cargando...</div></div>
    </section>
    <section id="profileWrap"><canvas id="profile" width="1200" height="260"></canvas></section>
    <section id="dataPanel">
      <div class="card"><div class="label">Distancia total</div><div id="totalDist" class="value">-</div></div>
      <div class="card"><div class="label">Recorrida</div><div id="doneDist" class="value">-</div></div>
      <div class="card"><div class="label">Por recorrer</div><div id="leftDist" class="value">-</div></div>
      <div class="card"><div class="label">Última posición</div><div id="lastUpdate" class="value">-</div></div>
      <div class="card"><div class="label">Batería restante</div><div id="batteryLeft" class="value">-</div></div>
      <div class="card"><div class="label">Velocidad actual</div><div id="speedNow" class="value">-</div></div>
      <div class="card"><div class="label">Velocidad media</div><div id="speedAvg" class="value">-</div></div>
      <div class="card"><div class="label">D+ total</div><div id="gainTotal" class="value">-</div></div>
      <div class="card"><div class="label">D+ hecho / restante</div><div id="gainDoneLeft" class="value">-</div></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const routeId = new URLSearchParams(location.search).get('id') || 'daniel-live';
    const supabaseUrl = (window.FEO_SUPABASE_URL || '').replace(/\/$/, '');
    const anonKey = window.FEO_SUPABASE_ANON_KEY || '';
    const statusText = document.getElementById('statusText');
    const map = L.map('map', {
      zoomControl:true,
      preferCanvas:true,
      zoomAnimation:true,
      fadeAnimation:true,
      markerZoomAnimation:true,
      zoomSnap:0.25,
      zoomDelta:0.5,
      wheelPxPerZoomLevel:140,
      wheelDebounceTime:90,
      inertia:true,
      inertiaDeceleration:2500,
      maxBoundsViscosity:0.35
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      updateWhenIdle:true,
      updateWhenZooming:false,
      keepBuffer:2,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    let trackLayer = null, actualLayer = null, meMarker = null, poiLayer = L.layerGroup().addTo(map), fitted = false, lastFitMode = '';

    const icon = (cls, text) => L.divIcon({ className:'', html:`<div class="${cls}">${text}</div>`, iconSize:[34,34], iconAnchor:[17,17] });
    const fmtAge = ms => { if (!ms) return '-'; const s=Math.max(0,Math.round((Date.now()-ms)/1000)); if(s<60)return `${s}s`; const m=Math.round(s/60); if(m<60)return `${m}min`; return `${Math.round(m/60)}h`; };
    const fmtKm = m => Number.isFinite(m) ? (m/1000).toFixed(1).replace('.', ',') + ' km' : '-';
    const fmtM = m => Number.isFinite(m) ? Math.round(m) + ' m' : '-';
    const fmtSpeed = v => Number.isFinite(v) ? v.toFixed(1).replace('.', ',') + ' km/h' : '-';
    const fmtBattery = (v, fallback) => { const b = Number.isFinite(Number(v)) ? Number(v) : (Number.isFinite(Number(fallback)) ? Number(fallback) : NaN); return Number.isFinite(b) ? Math.round(b) + '%' : '-'; };
    const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

    async function api(path) {
      const res = await fetch(`${supabaseUrl}/rest/v1/${path}`, { headers:{ apikey:anonKey, Authorization:`Bearer ${anonKey}` }});
      if (!res.ok) throw new Error('Supabase ' + res.status);
      return await res.json();
    }

    async function loadLive() {
      if (!supabaseUrl || !anonKey) return showConfigError('Falta configurar config.js.');
      try {
        map.invalidateSize(false);
        const sessions = await api(`feo_live_sessions?select=payload,updated_at&id=eq.${encodeURIComponent(routeId)}`);
        if (!sessions.length) {
          statusText.textContent = 'Live apagado o sin datos todavía';
          render({}, [], null);
          return;
        }
        const session = (sessions[0] && sessions[0].payload) || {};
        const startMs = Number.isFinite(session.sessionStartedAtMs) ? session.sessionStartedAtMs : (session.timestamp || Date.parse(sessions[0].updated_at));
        let pointsPath = `feo_live_points?select=lat,lon,ele,speed_kmh,accuracy_m,actual_distance_m,battery_percent,time_ms&session_id=eq.${encodeURIComponent(routeId)}&order=time_ms.asc&limit=5000`;
        if (Number.isFinite(startMs)) pointsPath += `&time_ms=gte.${Math.floor(startMs)}`;
        const points = await api(pointsPath);
        render(session, points || [], sessions[0] && sessions[0].updated_at);
      } catch (e) { statusText.textContent = 'Error: ' + e.message; }
    }

    function showConfigError(msg) { document.body.innerHTML = `<div class="warn"><h2>Feo Puerto Live</h2><p>${msg}</p><p>Dirección fija: esta página mostrará la última ruta cuando actives Live en Feo Puerto.</p></div>`; }

    function render(session, points, updatedAt) {
      const route = Array.isArray(session.route) ? session.route.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon)) : [];
      const pois = Array.isArray(session.pois) ? session.pois : [];
      const sessionPos = normalizePosition(session.position);
      const actual = points.map(p => ({lat:p.lat, lon:p.lon, ele:p.ele, time:p.time_ms, speedKmh:p.speed_kmh, actualDistanceM:p.actual_distance_m, batteryPercent:p.battery_percent})).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));
      const latestPoint = actual.length ? actual[actual.length - 1] : sessionPos;
      const totalM = getTotalDistance(route, session.summary);
      const currentM = route.length && latestPoint ? nearestRouteDistance(route, latestPoint.lat, latestPoint.lon) : latestPoint && Number.isFinite(latestPoint.actualDistanceM) ? latestPoint.actualDistanceM : session.distanceM;
      const doneM = Number.isFinite(currentM) ? clamp(currentM, 0, totalM || currentM) : NaN;
      const leftM = Number.isFinite(totalM) && Number.isFinite(doneM) ? Math.max(0, totalM - doneM) : NaN;
      const gain = computeGain(route, doneM, session.summary);
      const elapsedH = elapsedHours(actual, session.sessionStartedAtMs || session.timestamp);
      const avgKmh = elapsedH > 0 && Number.isFinite(doneM) ? (doneM / 1000) / elapsedH : NaN;
      const latestMs = latestPoint && latestPoint.time ? latestPoint.time : (session.timestamp || Date.parse(updatedAt));

      document.getElementById('totalDist').textContent = fmtKm(totalM);
      document.getElementById('doneDist').textContent = fmtKm(doneM);
      document.getElementById('leftDist').textContent = fmtKm(leftM);
      document.getElementById('lastUpdate').textContent = fmtAge(latestMs);
      document.getElementById('batteryLeft').textContent = fmtBattery(latestPoint && latestPoint.batteryPercent, session.batteryPercent);
      document.getElementById('speedNow').textContent = fmtSpeed(latestPoint && latestPoint.speedKmh);
      document.getElementById('speedAvg').textContent = fmtSpeed(avgKmh);
      document.getElementById('gainTotal').textContent = fmtM(gain.total);
      document.getElementById('gainDoneLeft').textContent = `${fmtM(gain.done)} / ${fmtM(gain.left)}`;
      statusText.textContent = `Track ${route.length} pts · Pos ${latestPoint ? fmtAge(latestMs) : 'sin GPS'}`;

      drawMap(route, pois, actual, latestPoint);
      drawProfile(route, pois, doneM);
    }

    function normalizePosition(pos) {
      if (!pos || !Number.isFinite(pos.lat) || !Number.isFinite(pos.lon)) return null;
      return { lat:pos.lat, lon:pos.lon, ele:pos.ele, time:pos.time, speedKmh:pos.speedKmh, actualDistanceM:pos.actualDistanceM, batteryPercent:pos.batteryPercent };
    }
    function getTotalDistance(route, summary) { if (summary && Number.isFinite(summary.distanceM) && summary.distanceM > 0) return summary.distanceM; if (route.length && Number.isFinite(route[route.length-1].distM)) return route[route.length-1].distM; return NaN; }

    function drawMap(route, pois, actual, latestPoint) {
      map.invalidateSize(false);
      if (route.length) {
        const latlngs = route.map(p => [p.lat, p.lon]);
        if (!trackLayer) trackLayer = L.polyline(latlngs, { weight:6, opacity:.95, color:'#4fb0ff', smoothFactor:1.2 }).addTo(map).bindPopup('Track GPX previsto');
        else trackLayer.setLatLngs(latlngs);
        if (!fitted || lastFitMode !== 'route') {
          const b = trackLayer.getBounds();
          map.fitBounds(b.pad(0.03), { padding:[12,12], animate:false });
          map.setMaxBounds(b.pad(0.16));
          fitted = true; lastFitMode = 'route';
          setTimeout(() => map.invalidateSize(false), 250);
        }
      }
      if (actual.length) {
        const realLatLngs = actual.map(p => [p.lat, p.lon]);
        if (!actualLayer) actualLayer = L.polyline(realLatLngs, { weight:7, opacity:.95, color:'#74ff91', smoothFactor:1 }).addTo(map).bindPopup('Ruta real desde Live ON');
        else actualLayer.setLatLngs(realLatLngs);
      }
      poiLayer.clearLayers();
      for (const p of pois) {
        if (!Number.isFinite(p.lat) || !Number.isFinite(p.lon)) continue;
        const isSuper = !!p.supermarket;
        const mk = L.marker([p.lat, p.lon], { icon: icon(isSuper ? 'shopIcon' : 'waterIcon', isSuper ? 'S' : '💧'), zIndexOffset:500 });
        const name = p.name || (isSuper ? 'Supermercado' : 'Agua');
        mk.bindPopup(`<b>${name}</b><br>Km ${Number.isFinite(p.routeDistM) ? (p.routeDistM/1000).toFixed(1) : '-'}`);
        mk.addTo(poiLayer);
      }
      if (latestPoint) {
        const ll = [latestPoint.lat, latestPoint.lon];
        if (!meMarker) meMarker = L.marker(ll, { icon:icon('meIcon','●'), zIndexOffset:1000 }).addTo(map).bindPopup('Última posición');
        else meMarker.setLatLng(ll);
        if (!route.length && (!fitted || lastFitMode !== 'point')) {
          const b = boundsAround(latestPoint.lat, latestPoint.lon, 50000);
          map.fitBounds(b, { padding:[12,12], animate:false });
          map.setMaxBounds(b.pad(0.05));
          fitted = true; lastFitMode = 'point';
        }
      }
    }

    function boundsAround(lat, lon, meters) { const dLat=meters/111320; const dLon=meters/(111320*Math.max(0.2,Math.cos(lat*Math.PI/180))); return L.latLngBounds([lat-dLat, lon-dLon], [lat+dLat, lon+dLon]); }
    function elapsedHours(actual, sessionTimestamp) { let start=NaN,end=NaN; if(actual.length>=2){start=actual[0].time;end=actual[actual.length-1].time;} else if(sessionTimestamp&&actual.length===1){start=sessionTimestamp;end=actual[0].time;} if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return NaN; return (end-start)/3600000; }
    function nearestRouteDistance(route, lat, lon) { let bestD=Infinity,bestM=NaN; for(const p of route){const d=haversine(lat,lon,p.lat,p.lon); if(d<bestD){bestD=d;bestM=p.distM;}} return bestM; }
    function haversine(a,b,c,d){const R=6371000,toRad=x=>x*Math.PI/180; const dLat=toRad(c-a),dLon=toRad(d-b); const s=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s));}
    function computeGain(route,currentM,summary){let total=summary&&Number.isFinite(summary.gainM)?summary.gainM:NaN,done=0;if(route.length){let calc=0;for(let i=1;i<route.length;i++){const inc=Math.max(0,(route[i].ele||0)-(route[i-1].ele||0));calc+=inc;if(Number.isFinite(currentM)&&(route[i].distM||0)<=currentM)done+=inc;}if(!Number.isFinite(total)||total<=0)total=calc;if(Number.isFinite(currentM)&&currentM>=getTotalDistance(route,summary))done=total;}return{total,done,left:Number.isFinite(total)&&Number.isFinite(done)?Math.max(0,total-done):NaN};}

    function drawProfile(route, pois, currentM) {
      const c = document.getElementById('profile');
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const rect = c.getBoundingClientRect();
      c.width = Math.max(1, Math.round(rect.width * ratio)); c.height = Math.max(1, Math.round(rect.height * ratio));
      const ctx = c.getContext('2d'); ctx.scale(ratio, ratio);
      const w=rect.width,h=rect.height; ctx.clearRect(0,0,w,h); ctx.fillStyle='#0c1723'; ctx.fillRect(0,0,w,h);
      if(!route.length){ctx.fillStyle='#8fa5bb';ctx.font='14px system-ui';ctx.fillText('Sin perfil de track',16,30);return;}
      const minEle=Math.min(...route.map(p=>Number.isFinite(p.ele)?p.ele:0));
      const maxEle=Math.max(...route.map(p=>Number.isFinite(p.ele)?p.ele:0));
      const total=route[route.length-1].distM||1; const padL=12,padR=12,padT=12,padB=18;
      const x=d=>padL+(w-padL-padR)*(d/total); const y=e=>h-padB-(h-padT-padB)*((e-minEle)/Math.max(1,maxEle-minEle));
      ctx.beginPath();ctx.moveTo(x(route[0].distM||0),h-padB);route.forEach(p=>ctx.lineTo(x(p.distM||0),y(p.ele||0)));ctx.lineTo(x(total),h-padB);ctx.closePath();ctx.fillStyle='rgba(79,176,255,.18)';ctx.fill();
      ctx.strokeStyle='#4fb0ff';ctx.lineWidth=2.4;ctx.beginPath();route.forEach((p,i)=>{const xx=x(p.distM||0),yy=y(p.ele||0);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);});ctx.stroke();
      for(const p of pois){if(!Number.isFinite(p.routeDistM))continue;ctx.beginPath();ctx.fillStyle=p.supermarket?'#ff9f2d':'#31b7ff';ctx.arc(x(p.routeDistM),19,5,0,Math.PI*2);ctx.fill();}
      if(Number.isFinite(currentM)){const cm=clamp(currentM,0,total),xx=x(cm),py=y(interpEle(route,cm));ctx.strokeStyle='#ffcc33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(xx,8);ctx.lineTo(xx,h-10);ctx.stroke();ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.arc(xx,py,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}
    }
    function interpEle(route,dist){if(!route.length)return 0;for(let i=1;i<route.length;i++){if((route[i].distM||0)>=dist){const a=route[i-1],b=route[i];const span=Math.max(1,(b.distM||0)-(a.distM||0));const t=(dist-(a.distM||0))/span;return(a.ele||0)+((b.ele||0)-(a.ele||0))*t;}}return route[route.length-1].ele||0;}

    loadLive(); setInterval(loadLive,60000); window.addEventListener('resize',()=>setTimeout(loadLive,150)); window.addEventListener('orientationchange',()=>setTimeout(loadLive,400));
  </script>
</body>
</html>
